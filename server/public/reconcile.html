<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>付款核销台 — AGI Engine</title>
<style>
  :root { --bg:#0b0e14; --card:#151a24; --line:#232b3a; --txt:#e6e9ef; --mut:#9aa4b8; --acc:#5b8cff; --ok:#3ecf8e; --warn:#f5a623; --err:#ff6b6b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; line-height:1.55; }
  .wrap { max-width:1000px; margin:0 auto; padding:28px 20px 60px; }
  header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:22px; }
  h1 { font-size:22px; margin:0; }
  .badge { display:inline-block; padding:3px 10px; border-radius:20px; font-size:12px; font-weight:600; }
  .b-pending { background:#3a2e12; color:var(--warn); }
  .b-approved { background:#12362a; color:var(--ok); }
  .b-rejected { background:#3a1c1c; color:var(--err); }
  .stat { display:flex; gap:14px; flex-wrap:wrap; margin-bottom:22px; }
  .stat div { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 20px; min-width:120px; }
  .stat b { display:block; font-size:26px; }
  .stat span { color:var(--mut); font-size:12px; }
  input, select { padding:10px 12px; background:#0e131c; border:1px solid var(--line); border-radius:8px; color:var(--txt); font-size:14px; }
  .table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  th, td { text-align:left; padding:12px 14px; border-bottom:1px solid var(--line); font-size:13px; vertical-align:middle; }
  th { background:#111622; color:var(--mut); font-weight:600; }
  tr:last-child td { border-bottom:0; }
  .plan { font-weight:600; }
  .plan.annual { color:var(--acc); }
  .plan.monthly { color:var(--ok); }
  code { background:#0e131c; padding:2px 6px; border-radius:5px; font-size:12px; }
  button { padding:7px 12px; border-radius:7px; border:0; cursor:pointer; font-size:13px; font-weight:600; }
  .appr { background:var(--ok); color:#04231a; }
  .rej { background:#2a3242; color:var(--txt); margin-left:6px; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  .login { max-width:420px; margin:60px auto; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:26px; }
  .login input { width:100%; margin:10px 0; }
  .login button { width:100%; padding:12px; background:var(--acc); color:#fff; font-size:15px; }
  .msg { margin-top:12px; font-size:13px; min-height:20px; }
  .msg.err { color:var(--err); }
  .empty { text-align:center; color:var(--mut); padding:40px; }
  .hint { font-size:12px; color:var(--mut); margin-top:8px; }
  a { color:var(--acc); }
</style>
</head>
<body>
<div class="wrap" id="app" style="display:none">
  <header>
    <div>
      <h1>付款核销台</h1>
      <div class="hint">核对 PayPal 收款 → 批准 → 自动开通 Pro 权限。数据源：服务端真实记录。</div>
    </div>
    <div><a href="/dashboard">← 数据看板</a> &nbsp;|&nbsp; <button class="rej" onclick="logout()">退出</button></div>
  </header>

  <div class="stat">
    <div><b id="s-pending">0</b><span>待核销</span></div>
    <div><b id="s-approved">0</b><span>已开通</span></div>
    <div><b id="s-revenue">$0</b><span>累计收入</span></div>
    <div><b id="s-today">$0</b><span>今日收入</span></div>
  </div>

  <table class="table">
    <thead><tr><th>认领编号</th><th>套餐</th><th>邮箱</th><th>交易号</th><th>用户ID</th><th>渠道</th><th>提交时间</th><th>状态</th><th>操作</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="hint" id="refreshed"></div>
</div>

<div class="login" id="login">
  <h1>管理员登录</h1>
  <p class="hint">输入 ADMIN_TOKEN（在 server/.env 中设置）。这是核销台的访问凭证。</p>
  <input id="token" type="password" placeholder="ADMIN_TOKEN">
  <button onclick="doLogin()">进入核销台</button>
  <div class="msg err" id="login-msg"></div>
</div>

<script>
let TOKEN = sessionStorage.getItem('agi_admin_token') || '';
// Allow ?token=... in URL (convenient bookmark). Prefer explicit session token.
const urlToken = new URLSearchParams(location.search).get('token');
if (!TOKEN && urlToken) { TOKEN = urlToken; sessionStorage.setItem('agi_admin_token', TOKEN); }
const $ = id => document.getElementById(id);

if (TOKEN) showApp();

function doLogin(){
  const t = $('token').value.trim();
  if(!t){ $('login-msg').textContent='请输入 token'; return; }
  fetch('/api/admin/claims',{headers:{'x-admin-token':t}})
    .then(r=>{ if(r.ok){ TOKEN=t; sessionStorage.setItem('agi_admin_token',t); showApp(); } else { $('login-msg').textContent='Token 错误或无权访问'; } })
    .catch(e=>$('login-msg').textContent='网络错误：'+e.message);
}
function logout(){ sessionStorage.removeItem('agi_admin_token'); location.reload(); }
function showApp(){ $('login').style.display='none'; $('app').style.display='block'; load(); }

function esc(s){ return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function load(){
  Promise.all([
    fetch('/api/admin/claims',{headers:{'x-admin-token':TOKEN}}).then(r=>r.json()),
    fetch('/api/report').then(r=>r.json())
  ]).then(([claims,rep])=>{
    if(claims.error){ $('login-msg').textContent=claims.error; return; }
    const rows = claims.claims || [];
    $('s-pending').textContent = rows.filter(c=>c.status==='PENDING').length;
    $('s-approved').textContent = rows.filter(c=>c.status==='APPROVED').length;
    $('s-revenue').textContent = '$'+(rep.revenue.total||0).toFixed(2);
    $('s-today').textContent = '$'+(rep.revenue.today||0).toFixed(2);

    const tb = $('rows');
    if(!rows.length){
      tb.innerHTML = '<tr><td colspan="9" class="empty">暂无认领记录。用户付款并提交凭证后会显示在这里。</td></tr>';
    } else {
      tb.innerHTML = rows.map(c=>{
        const badge = c.status==='PENDING'?'<span class="badge b-pending">待核销</span>'
          : c.status==='APPROVED'?'<span class="badge b-approved">已开通</span>'
          : '<span class="badge b-rejected">已拒绝</span>';
        const actions = c.status==='PENDING'
          ? '<button class="appr" onclick="review(\''+c.id+'\',\'approve\')">✓ 批准</button><button class="rej" onclick="review(\''+c.id+'\',\'reject\')">拒绝</button>'
          : '—';
        return '<tr>'
          +'<td><code>'+esc(c.id)+'</code></td>'
          +'<td><span class="plan '+c.plan+'">'+(c.plan==='annual'?'$100/年':'$15/月')+'</span></td>'
          +'<td>'+esc(c.email)+'</td>'
          +'<td><code>'+esc(c.txn)+'</code></td>'
          +'<td>'+esc(c.clientId)+'</td>'
          +'<td>'+esc(c.channel)+'</td>'
          +'<td>'+new Date(c.ts).toLocaleString('zh-CN')+'</td>'
          +'<td>'+badge+'</td>'
          +'<td>'+actions+'</td>'
          +'</tr>';
      }).join('');
    }
    $('refreshed').textContent = '最后刷新：'+new Date().toLocaleTimeString('zh-CN')+' · 数据来自服务端 · 批准前请到 PayPal 后台核对交易号确实到账';
  }).catch(e=>{ $('login-msg').textContent='加载失败：'+e.message; });
}

function review(id, action){
  let extra = {};
  if(action==='approve'){
    const amt = prompt('核对到账金额（USD）。直接回车用默认：年 $100 / 月 $15', '');
    if(amt!==null && amt.trim()!=='') extra.amount = Number(amt);
  } else {
    const reason = prompt('拒绝原因（可选）：','');
    if(reason!==null) extra.reason = reason;
  }
  fetch('/api/admin/claim/'+action,{
    method:'POST',
    headers:{'Content-Type':'application/json','x-admin-token':TOKEN},
    body: JSON.stringify(Object.assign({id},extra))
  }).then(r=>r.json()).then(d=>{
    if(d.ok){ alert(action==='approve'?'✓ 已批准，Pro 权限已开通':'已拒绝'); load(); }
    else alert('操作失败：'+(d.error||'未知错误'));
  }).catch(e=>alert('网络错误：'+e.message));
}

setInterval(()=>{ if(TOKEN) load(); }, 30000);
</script>
</body>
</html>
